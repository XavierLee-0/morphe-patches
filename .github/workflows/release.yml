name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from gradle.properties; upstream bumps it on new releases.
      - name: Determine version
        id: ver
        run: |
          VERSION=$(sed -n 's/^version *= *//p' gradle.properties | tr -d '\r')
          echo "Patches version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-latest runners ship with the Android SDK; just accept licenses
      # and install the platform version the extensions build against.
      - name: Accept licenses and install Android platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_ACTOR: XavierLee-0
        run: |
          ./gradlew :patches:generatePatchesList --no-daemon
          # buildAndroid compiles patch classes to DEX and merges classes.dex
          # into the .mpp — Morphe Manager loads patches from the dex.
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Verify bundle contains dex
        run: unzip -l patches/build/libs/patches-${{ steps.ver.outputs.version }}.mpp | grep classes.dex

      - name: Prepare artifact
        run: |
          mkdir -p dist
          ls patches/build/libs/
          cp patches/build/libs/patches-${{ steps.ver.outputs.version }}.mpp \
             dist/patches-${{ steps.ver.outputs.version }}-custom.1.mpp

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: v${{ steps.ver.outputs.version }}-custom.1
          ASSET: patches-${{ steps.ver.outputs.version }}-custom.1.mpp
        run: |

          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Upstream ${TAG}-custom base + Disable swipe gestures for Minimal miniplayer\"}" \
              | jq -r '.id')
            echo "Created release id=$RELEASE_ID"
          fi

          # Remove stale asset with the same name so the upload always succeeds
          ASSET_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID/assets" \
            | jq -r ".[] | select(.name==\"$ASSET\") | .id")
          if [ -n "$ASSET_ID" ]; then
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID"
            echo "Deleted stale asset id=$ASSET_ID"
          fi

          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"dist/$ASSET" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET" \
            | jq -r '.name, .state, .browser_download_url'

      # Morphe Manager on some networks cannot follow the GitHub release
      # redirect chain, so the patch bundle points at jsDelivr which serves
      # the mpp straight from this repo's dist/ folder (no redirects, CDN).
      - name: Mirror mpp into the repository for jsDelivr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          ASSET: patches-${{ steps.ver.outputs.version }}-custom.1.mpp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "dist/$ASSET" ] && cmp -s "dist/$ASSET" "patches/build/libs/patches-$VERSION.mpp"; then
            echo "dist/$ASSET already up to date — nothing to mirror"
          else
            mkdir -p dist
            cp "patches/build/libs/patches-$VERSION.mpp" "dist/$ASSET"
            # Keep only the latest mirrored build.
            find dist -name 'patches-*.mpp' ! -name "$ASSET" -delete
            jq --arg u "https://cdn.jsdelivr.net/gh/XavierLee-0/morphe-patches@main/dist/$ASSET" \
              '.download_url = $u' patches-bundle.json > patches-bundle.json.tmp \
              && mv patches-bundle.json.tmp patches-bundle.json
            git add dist patches-bundle.json
            if git diff --cached --quiet; then
              echo "Nothing to commit"
            else
              git commit -m "ci: mirror $ASSET into dist/ [skip ci]"
              git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD:main
            fi
          fi
