name: Sync upstream

# Daily check for a new stable release of MorpheApp/morphe-patches.
#
# Repository history convention ("shallow-root" history — the upstream
# baseline is a local root commit, not the real upstream history, so pushes
# stay small and the repo does not need to mirror thousands of upstream
# commits):
#
#   Upstream MorpheApp/morphe-patches vX.Y.Z   (root commit or chained)
#     └─ Custom: ...                            (only our local changes)
#         └─ Upstream MorpheApp/morphe-patches vX.Z+1
#             └─ Custom: ...
#
# On a new upstream release:
#   1. generate the custom patch = 'git diff HEAD~1 HEAD' (source files only)
#   2. replace the working tree with the new upstream tag content
#   3. apply the custom patch (3-way) — conflicts fail the job on purpose
#   4. commit the new baseline, then re-apply our custom changes and CI files
#   5. push (fast-forward, no force) — this triggers "Build and Release"
#
# IMPORTANT: HEAD~1 must always be an "Upstream ..." baseline commit. Never
# push hand-made commits directly on main that break this pairing, or the
# patch generation below produces garbage.

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai daily
  workflow_dispatch:

env:
  UPSTREAM_REPO: MorpheApp/morphe-patches

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT instead of the default GITHUB_TOKEN: pushes made with the
          # default token do not trigger the "Build and Release" workflow.
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Locate the current upstream baseline commit
        id: baseline
        run: |
          # The custom patch is always generated against the most recent
          # "Upstream ..." baseline commit, NOT HEAD~1: hand-made commits
          # (CI tweaks, small fixes) may sit between it and HEAD, and their
          # source changes are carried over as part of the custom patch.
          BASE=$(git log --grep='^Upstream MorpheApp/morphe-patches ' -1 --format=%H)
          if [ -z "$BASE" ]; then
            echo "::error::No 'Upstream MorpheApp/morphe-patches ...' baseline commit found in main history."
            exit 1
          fi
          echo "Baseline commit: $(git log -1 --format='%h %s' "$BASE")"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Check for new stable release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=$(gh api "repos/${UPSTREAM_REPO}/releases" \
            --paginate --jq '.[] | select(.prerelease == false and .draft == false) | .tag_name' \
            | head -n1)
          echo "Latest upstream stable release: $TAG"
          LOCAL_VERSION=$(sed -n 's/^version *= *//p' gradle.properties | tr -d '\r')
          echo "Our base version: $LOCAL_VERSION"
          if [ "${TAG#v}" = "$LOCAL_VERSION" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate custom feature patch
        if: steps.check.outputs.update == 'true'
        run: |
          git diff "${{ steps.baseline.outputs.sha }}" HEAD \
            -- . ':(exclude).github' ':(exclude).gitattributes' \
               ':(exclude)patches-bundle.json' ':(exclude)Dockerfile' \
            > /tmp/custom.patch
          if [ ! -s /tmp/custom.patch ]; then
            echo "::error::Generated patch is empty — nothing to apply?"
            exit 1
          fi
          echo "Patch size: $(wc -l < /tmp/custom.patch) lines"

      - name: Fetch upstream release content
        if: steps.check.outputs.update == 'true'
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          # Shallow fetch of just the new tag keeps the transfer small.
          git fetch upstream "refs/tags/${{ steps.check.outputs.tag }}:refs/tags/${{ steps.check.outputs.tag }}" --depth=1 --no-tags

      - name: Replace working tree with the new upstream release
        if: steps.check.outputs.update == 'true'
        run: |
          # Replace index + working tree with the upstream tree while keeping
          # HEAD on main, so the next commit (the new baseline) gets the
          # current main HEAD as its parent and the push stays a fast-forward.
          git read-tree -u --reset "refs/tags/${{ steps.check.outputs.tag }}^{tree}"

      - name: Apply custom patch (3-way)
        if: steps.check.outputs.update == 'true'
        run: git apply --3way /tmp/custom.patch

      - name: Sanity check the custom settings survived
        if: steps.check.outputs.update == 'true'
        run: |
          SETTINGS_FILE="extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java"
          grep -q "morphe_miniplayer_minimal_disable_swipe_gestures" "$SETTINGS_FILE" || {
            echo "::error::'Disable swipe gestures' setting missing after patch — upstream restructured the code."
            exit 1
          }
          grep -q "morphe_miniplayer_minimal_disable_drag" "$SETTINGS_FILE" || {
            echo "::error::'Disable dragging the bar' setting missing after patch — upstream restructured the code."
            exit 1
          }

      - name: Commit new upstream baseline
        if: steps.check.outputs.update == 'true'
        run: |
          # Replace index + working tree with the vanilla upstream content
          # WITHOUT moving main (a 'git reset --hard <tag>' here would move
          # the branch onto the shallow upstream history and break the
          # fast-forward push). Committing afterwards creates the baseline
          # with the current main HEAD as parent, so the push stays a
          # fast-forward and HEAD~1 remains the previous custom commit.
          git read-tree -u --reset "refs/tags/${{ steps.check.outputs.tag }}^{tree}"
          git commit -m "Upstream MorpheApp/morphe-patches ${{ steps.check.outputs.tag }}

          Upstream baseline commit (vanilla ${{ steps.check.outputs.tag }} content)."

      - name: Re-apply custom changes and CI files
        if: steps.check.outputs.update == 'true'
        run: |
          # Replay the custom source changes on top of the new baseline.
          git apply --3way /tmp/custom.patch
          # Wipe upstream's CI infra and restore ours (upstream ships its own
          # .github with workflows we do not want, so a plain checkout of
          # overlapping paths is not enough — remove the whole trees first).
          git rm -rq --ignore-unmatch .github .gitattributes patches-bundle.json Dockerfile
          git checkout HEAD~1 -- .github .gitattributes patches-bundle.json Dockerfile

      - name: Align patches-bundle.json
        if: steps.check.outputs.update == 'true'
        run: |
          # Keep the schema EXACTLY like the bundle that worked for this
          # source historically: created_at without the 'Z' suffix, github
          # release download url, and NO public_key (adding one makes Manager
          # reject the update because the source's key changed mid-flight).
          VERSION=$(sed -n 's/^version *= *//p' gradle.properties | tr -d '\r')
          TAG="v${VERSION}-custom.1"
          ASSET="patches-${VERSION}-custom.1.mpp"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S)
          jq --arg v "${VERSION}-custom.1" --arg u "$URL" --arg t "$NOW" \
            '.version = $v | .download_url = $u | .created_at = $t | del(.public_key) |
             .description = "Morphe Patches '"${VERSION}"' + custom feature: Disable swipe gestures setting for the Minimal / Minimal 2 miniplayer. Based on upstream v'"${VERSION}"'."' \
            patches-bundle.json > patches-bundle.json.tmp && mv patches-bundle.json.tmp patches-bundle.json
          cat patches-bundle.json

      - name: Commit custom changes and push
        if: steps.check.outputs.update == 'true'
        run: |
          git add -A
          git commit -m "Custom: disable swipe gestures for Minimal / Minimal 2 miniplayer

          Re-applied by the Sync upstream workflow on top of the new upstream
          baseline. 'git diff HEAD~1 HEAD' (excluding CI files) is the current
          custom patch."
          git log --oneline -4
          git push origin HEAD:main

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="Upstream sync failed — manual merge needed"
          OPEN=$(gh issue list --repo "$REPO" --state open --search "${TITLE} in:title" --json number --jq 'length')
          if [ "${OPEN:-0}" = "0" ]; then
            gh issue create --repo "$REPO" \
              --title "$TITLE" \
              --body "The daily sync of ${UPSTREAM_REPO} failed (merge conflict or upstream restructure). The 'Disable swipe gestures' changes in MinimalMiniplayerPatch.java / MiniplayerPatch.kt / Settings.java likely need to be re-applied on top of the new upstream code. Ask the agent to resolve and push."
          else
            echo "Failure issue already open."
          fi
